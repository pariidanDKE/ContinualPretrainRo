- model.builder.model_name=meta-llama/Llama-3.2-1B-Instruct
- model.builder.use_unsloth=true
- data_collator.packing=true
- model.lora.r=128
- model.lora.lora_alpha=256
- training_args.per_device_train_batch_size=32
- training_args.gradient_accumulation_steps=1
- training_args.output_dir=outputs/test_runs/
- training_args.max_length=2048
- milestone.target_tokens=25000000
- milestone.total_training_tokens=100000000
- milestone.merged_output_dir=outputs/test_runs//merged
- milestone.do_evaluate=true
- milestone.prebuilt_dataset_path=data/mixed_milestone_dataset
- milestone.current_milestone=0
- wandb.group=fix_loss
- training_args.learning_rate=6e-5
- training_args.embedding_learning_rate=2e-5
- wandb.run_name=test_run
