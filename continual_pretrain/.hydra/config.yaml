seed: 23
dataset:
  tokenize: false
  use_sft: false
  sample_size: 1000
  text_field: text
  name: danp27/norobots_sft
  split: train
  add_bos_eos: true
  num_proc: 4
data_builder:
  enabled: true
  datasets:
  - name: danp27/norobots_sft
    split: train
    proportion: 0.5
    text_field: null
    add_bos_eos: null
    num_proc: null
  - name: ./data/formatted_data/dolly
    split: train
    proportion: 0.5
    text_field: null
    add_bos_eos: null
    num_proc: null
data_collator:
  use_custom_packed: false
  packing: true
  packing_strategy: bfd
model:
  builder:
    model_name: unsloth/Llama-3.2-1B
    tokenizer_name: null
    load_in_4bit: false
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    device_map: auto
    gradient_checkpointing: true
    use_cache: false
    prepare_kbit_training: true
    require_grads: true
    max_seq_length: 2048
    use_unsloth: true
    seed: 42
  lora:
    r: 64
    lora_alpha: 64
    lora_dropout: 0.0
    bias: none
    task_type: CAUSAL_LM
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - embed_tokens
    - lm_head
training_args:
  output_dir: outputs/test_runs/cpt-llama-CPTTestSpikyLoss_maxgrad1_lr1e4_ga4-ms20-100M
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 4
  max_length: 4096
  logging_steps: 5
  learning_rate: 0.0001
  embedding_learning_rate: 0.02
  num_train_epochs: 1
  save_steps: 100
  save_total_limit: 1
  report_to: wandb
  bf16: true
  fp16: false
  optim: paged_adamw_8bit
  lr_scheduler_type: cosine
  warmup_ratio: 0.06
  gradient_checkpointing: true
  max_grad_norm: 1
  dataloader_drop_last: true
wandb:
  enabled: true
  project: RoLLM
  run_name: cpt-llama-CPTTestSpikyLoss_maxgrad1_lr1e4_ga4-ms20-100M
  group: TestCPT
milestone:
  target_tokens: 5000000
  resume_from_checkpoint: null
  merged_output_dir: outputs/test_runs/cpt-llama-CPTTestSpikyLoss_maxgrad1_lr1e4_ga4-ms20-100M/merged
  total_training_tokens: 100000000
  do_evaluate: false
  prebuilt_dataset_path: data/mixed_milestone_dataset
  current_milestone: 2
