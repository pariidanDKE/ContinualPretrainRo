seed: 23
dataset:
  tokenize: false
  sample_size: null
  text_field: formatted_text
  name: danp27/norobots_sft
  split: train
  add_bos_eos: false
  num_proc: 4
data_builder:
  enabled: true
  datasets:
  - name: ./data/formatted_data/orca
    split: train
    proportion: 0.5
    sample_size: 110000
  - name: ./data/formatted_data/maggie
    split: train
    proportion: 0.5
    sample_size: 110000
data_collator:
  pack_length: 2048
  use_custom_packed: false
  packing: true
model:
  builder:
    model_name: meta-llama/Llama-3.2-1B-Instruct
    tokenizer_name: null
    load_in_4bit: false
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    device_map: auto
    gradient_checkpointing: true
    use_cache: false
    prepare_kbit_training: true
    require_grads: true
    max_seq_length: 2048
    use_unsloth: false
    seed: 42
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.0
    bias: none
    task_type: CAUSAL_LM
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training_args:
  output_dir: ./outputs/train_llama
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_length: 2048
  logging_steps: 5
  learning_rate: 0.0001
  embedding_learning_rate: 2.0e-05
  num_train_epochs: 1
  save_steps: 100
  save_total_limit: 1
  report_to: wandb
  bf16: true
  fp16: false
  optim: paged_adamw_8bit
  lr_scheduler_type: constant
  warmup_ratio: 0.03
  gradient_checkpointing: true
  max_grad_norm: 1
wandb:
  enabled: true
  project: RoLLM
  run_name: test1
  group: null
milestone:
  target_tokens: 1000000
  resume_from_checkpoint: null
  merged_output_dir: null
  total_training_tokens: null
  do_evaluate: true
  prebuilt_dataset_path: null
  current_milestone: 0
  num_milestones: 5
  tokens_per_milestone: 5000000
output_dir: data/mixed_milestone_dataset
