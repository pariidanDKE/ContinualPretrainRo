hydra:
  run:
    dir: .
  sweep:
    dir: multiruns
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model.builder.model_name=meta-llama/Llama-3.2-1B
    - model.builder.use_unsloth=true
    - data_collator.packing=true
    - model.lora.r=128
    - model.lora.lora_alpha=256
    - training_args.per_device_train_batch_size=32
    - training_args.gradient_accumulation_steps=4
    - training_args.output_dir=outputs/test_runs/cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M
    - training_args.max_length=4096
    - milestone.target_tokens=160000000
    - milestone.total_training_tokens=800000000
    - milestone.merged_output_dir=outputs/test_runs/cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M/merged
    - milestone.do_evaluate=false
    - milestone.prebuilt_dataset_path=data/mixed_milestone_dataset
    - milestone.current_milestone=1
    - dataset.use_sft=false
    - dataset.text_field=text
    - wandb.group=TestCPT
    - training_args.learning_rate=1e-4
    - training_args.embedding_learning_rate=2e-2
    - wandb.run_name=cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M
    - milestone.resume_from_checkpoint=outputs/test_runs/cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M/checkpoint-152
  job:
    name: train_milestone_segment
    chdir: null
    override_dirname: data_collator.packing=true,dataset.text_field=text,dataset.use_sft=false,milestone.current_milestone=1,milestone.do_evaluate=false,milestone.merged_output_dir=outputs/test_runs/cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M/merged,milestone.prebuilt_dataset_path=data/mixed_milestone_dataset,milestone.resume_from_checkpoint=outputs/test_runs/cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M/checkpoint-152,milestone.target_tokens=160000000,milestone.total_training_tokens=800000000,model.builder.model_name=meta-llama/Llama-3.2-1B,model.builder.use_unsloth=true,model.lora.lora_alpha=256,model.lora.r=128,training_args.embedding_learning_rate=2e-2,training_args.gradient_accumulation_steps=4,training_args.learning_rate=1e-4,training_args.max_length=4096,training_args.output_dir=outputs/test_runs/cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M,training_args.per_device_train_batch_size=32,wandb.group=TestCPT,wandb.run_name=cpt-llama-CPTSignalEstablishment_maxgrad1_lr1e4-ms10-800M
    id: ???
    num: ???
    config_name: train_model.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/dan-parii/Documents/ContinualPretrainRo/continual_pretrain
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/dan-parii/Documents/ContinualPretrainRo/continual_pretrain/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/dan-parii/Documents/ContinualPretrainRo/continual_pretrain
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
