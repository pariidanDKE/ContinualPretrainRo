defaults:
  - train_model  # Inherit base configuration
  - _self_

# Continual Pre-Training (CPT) Configuration
# This config modifies train_model.yaml for CPT instead of SFT

dataset:
  tokenize: false  # Let trainer handle tokenization (almost always false)
  use_sft: false   # CPT mode: Disables chat templates and loss masking (trains on all tokens)
  text_field: "text"  # Column name for raw text (not "formatted_text")
  add_bos_eos: false  # Let packing handle EOS tokens between documents
  sample_size: null  # Use full dataset

data_builder:
  enabled: true
  datasets:
    # Example: Romanian web text corpus for CPT
    - name: "OpenLLM-Ro/fineweb2-ro-llm"
      split: "train"
      proportion: 1.0
      sample_size: 100000  # Adjust as needed

# For CPT, packing is highly recommended to maximize GPU utilization
data_collator:
  packing: true

# Use base models (not instruction-tuned) for CPT
model:
  builder:
    model_name: "meta-llama/Llama-3.2-1B"  # Base model, not Instruct
    use_unsloth: false

training_args:
  output_dir: "./outputs/cpt_llama"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  max_length: 2048
  learning_rate: 6e-5
  num_train_epochs: 1

wandb:
  enabled: true
  project: "RoLLM-CPT"
  run_name: "cpt_test"
  group: "continual_pretrain"
