defaults:
  - train_model  # Inherit data_builder and dataset configuration
  - _self_

# Override specific settings for dataset building
output_dir: "data/mixed_milestone_dataset"
seed: 23 # the default seed is 42(!)

milestone:
  num_milestones: 8  # Number of milestones to divide data into
  tokens_per_milestone: 25000000  # 25M tokens per milestone (200M total)
  buffer_multiplier: 1.2  # Shard size multiplier (1.5x = 37.5M per shard for 25M target)

# For testing, set sample_size to a small number
# dataset:
#   sample_size: 1000

dataset:
  sample_size: null
  tokenize: false  # Let trainer handle tokenization (almost always false)
  use_sft: true    # SFT mode (Romanian tags → model tokens). Set to false for CPT (raw text, no formatting)

# Sample sizes calculated for 200M total tokens:
# Target distribution:
#   - dolly (4.4M tokens) + norobots (4.8M) + camel (84M) + oasst (4.7M) = ~98M (USE ALL DATA)
#   - maggie: 80M tokens needed
#   - orca: 24M tokens needed
# Total: 200M tokens
#
# Proportions:
#   dolly:    4.4M / 200M = 0.022 (2.2%)  - USE ALL 15,011 examples
#   norobots: 4.8M / 200M = 0.024 (2.4%)  - USE ALL 9,999 examples
#   oasst:    4.7M / 200M = 0.024 (2.4%)  - USE ALL 8,658 examples
#   camel:    84M / 200M  = 0.420 (42.0%) - USE ALL 110,000 examples
#   maggie:   80M / 200M  = 0.400 (40.0%) - 80M / 1839 tok/ex = 43,502 → 57,000 (w/ buffer)
#   orca:     24M / 200M  = 0.120 (12.0%) - 24M / 611 tok/ex = 39,279 → 51,000 (w/ buffer)

data_builder:
  enabled: true
  max_length: 4096
  datasets:

    - name: "OpenLLM-Ro/fineweb2-ro-llm"
      split: "train"
      proportion: 1
      sample_size : null
      #sample_size: 10000


