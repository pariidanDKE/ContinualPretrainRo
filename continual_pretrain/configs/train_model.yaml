defaults:
  - _self_

seed: 23 # the default seed is 42(!)

dataset:
  tokenize: false  # Let trainer handle tokenization (almost always false)
  use_sft: true    # SFT mode (Romanian tags → model tokens). Set to false for CPT (raw text, no formatting)
  sample_size: 1000  # set to an int for quick smoke tests
  text_field: "text"  # Input column name (DataPreprocessor reads from this)
  name: "danp27/norobots_sft"
  split: "train"
  add_bos_eos: true  # Add BOS/EOS tokens to training data
  num_proc: 4

data_builder:
  enabled: true
  
  datasets:
    - name: "danp27/norobots_sft"
      split: "train"
      proportion: 0.5
      #sample_size: 1000
      text_field: null
      add_bos_eos: null
      num_proc: null
      
    - name: "./data/formatted_data/dolly"
      split: "train"
      proportion: 0.5
      #sample_size: 1000
      text_field: null
      add_bos_eos: null
      num_proc: null


data_collator:
  use_custom_packed : false
  packing : true
  packing_strategy: "bfd"  # "bfd" (best-fit decreasing) or "wrapped" (greedy streaming)

model:
  builder:
    model_name: "unsloth/Llama-3.2-1B"
    tokenizer_name: null 
    load_in_4bit: false
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    device_map: "auto"
    gradient_checkpointing: true
    use_cache: false
    prepare_kbit_training: true
    require_grads: true
    max_seq_length: 2048
    use_unsloth: false
    seed: 42

  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.0
    bias: "none"
    task_type: "CAUSAL_LM"
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - embed_tokens
      - lm_head

training_args:
  output_dir: "./outputs/train_llama"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 4
  max_length: 2048
  logging_steps: 5
  learning_rate: 1e-4
  embedding_learning_rate: 2e-5  # Lower LR for embeddings/LM head (only used with use_unsloth=true)
  num_train_epochs: 1
  save_steps: 100
  save_total_limit: 1
  report_to: "wandb"
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.06
  gradient_checkpointing: true
  max_grad_norm: 1
  dataloader_drop_last: true  # Drop incomplete batches to prevent low-density training steps

wandb:
  enabled: true
  project: "RoLLM"
  run_name: null  # Set to null to use auto-composed name: {cpt/sft}-{model}-{custom_name}-ms{milestones}-{tokens}M
  group: null

milestone:
  # Configuration for train_milestone_segment.py
  target_tokens: 1000000  # Target tokens for this segment (e.g., 1M, 100M)
  resume_from_checkpoint: null  # Path to checkpoint to resume from (or null for scratch)
  merged_output_dir: null  # Where to save merged LoRA models for evaluation (or null to skip)
  total_training_tokens: null  # Total tokens across ALL milestones (for consistent LR scheduling). Set to null to use target_tokens.
  do_evaluate: true  # Whether to run evaluation after training (set to false for testing)

  # Prebuilt dataset configuration (built with build_mixed_dataset.py)
  prebuilt_dataset_path: null  # Path to prebuilt milestone dataset (or null to build on-the-fly)
  current_milestone: 0  # Which milestone to load from prebuilt dataset (0-indexed)

hydra:
  run:
    dir: "."
  sweep:
    dir: "multiruns"
    subdir: ${hydra.job.num}
