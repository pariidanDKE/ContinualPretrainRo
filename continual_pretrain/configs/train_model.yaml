# ########################################################
# Benchmark Evaluation
# ########################################################

benchmark_evaluation_cfg:

  verbosity: INFO
  use_sft: false  # Set to false to disable chat template application (for PT models)
  apply_chat_template: true
  eval_batch_size: 8
  num_fewshot: 5
  device : auto

  tasks_to_run: [ "_ro_winogrande",  "_ro_arc_challenge", "arc_challenge", "winogrande", "ro_wiki", "wikitext", "_ro_hellaswag"] # remove belebele and mmlu
  #tasks_to_run: []
  perplexity_tasks: ["ro_wiki", "wikitext"] # for these do not apply chat template

  output_dir: eval_results
  max_length: 2048  # Default max_length for most benchmarks
  eval_max_length: 8192

  # List of all available tasks and their configs
  evaluation_tasks:
    - name: ro_wiki
      fewshot: 0
      task_batch_size: 8
      limit: 1000
      max_length: 2048

    - name: _ro_hellaswag
      fewshot: 5
      task_batch_size: 4
      limit: 1000
      max_length: 2048

    # - name: _ro_mmlu
    #   fewshot: 5
    #   task_batch_size: 1
    #   limit: 1000
    #   max_length: 2048  # MMLU uses shorter context

    - name: _ro_winogrande
      fewshot: 5
      task_batch_size: 8
      limit: 1000
      max_length: 2048

    # - name: _ro_belebele
    #   fewshot: 5
    #   task_batch_size: 1
    #   limit: 1000
    #   max_length: 2048  # Belebele uses shorter context

    - name: _ro_arc_challenge
      fewshot: 5
      task_batch_size: 8
      limit: 1000
      max_length: 2048

    - name: arc_challenge
      fewshot: 5
      task_batch_size: 8
      limit: 1000
      max_length: 2048

    - name: wikitext
      fewshot: 0
      task_batch_size: 8
      limit: 1000
      max_length: 2048

    - name: winogrande
      fewshot: 5
      task_batch_size: 8
      limit: 1000
      max_length: 2048
# ########################################################
# Wandb Configuration
# ########################################################

wandb:
  enabled: true
  project: "RoLLM"
  run_name: null  # Set to null to use auto-composed name: {cpt/sft}-{model}-{custom_name}-ms{milestones}-{tokens}M
  group: "Default"
  custom_run_name: "TestContinuousLoop"

# ########################################################
# Hydra Configuration
# ########################################################

hydra:
  run:
    dir: "."
  sweep:
    dir: "multiruns"
    subdir: ${hydra.job.num}

defaults:
  - _self_