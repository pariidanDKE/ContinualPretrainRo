
seed: 23 

# ########################################################
# Model Configuration
# ########################################################

model:
  builder:
    model_name: "unsloth/Llama-3.2-1B"
    load_in_4bit: true
    bnb_4bit_compute_dtype: "bfloat16"
    device_map: "auto"
    gradient_checkpointing: true
    use_cache: false
    prepare_kbit_training: true
    require_grads: true
    max_seq_length: 2048
    use_unsloth: true
    use_flash_attention: false
    seed: 42

  lora:
    r: 128
    lora_alpha: 128
    lora_dropout: 0.0
    bias: "none"
    task_type: "CAUSAL_LM"
    embedding_lora_mode: "lora"  # Options: "full_weights", "lora", "frozen"
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - embed_tokens
      - lm_head

training_args:
  output_dir: "./outputs/train_llama"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 4
  max_length: 2048
  logging_steps: 1
  learning_rate: 1e-4
  packing: true  # make training 2-5 times faster  
  embedding_learning_rate: 2e-5  # Lower LR for embeddings/LM head (only used with use_unsloth=true)
  num_train_epochs: 1
  save_steps: 100
  save_total_limit: 1
  report_to: "wandb"
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  lr_scheduler_type: "warmup_stable_decay"
  warmup_ratio: 0.06
  lr_scheduler_kwargs: null  # Auto-computed in milestone_trainer.py: num_decay_steps=10% of total steps
  gradient_checkpointing: true
  max_grad_norm: 1
  per_device_eval_batch_size: 4
  dataset_text_field: 'text'
  dataloader_drop_last: true  # Drop incomplete batches to prevent low-density training steps
  eval_on_start: true # evaluate model at global_step 0
 
validation_cfg:
  return_validation: true
  validation_split: 0.05

# ########################################################
# Milestone Configuration
# ########################################################

milestone:
  tokens_per_milestone: 25000000
  num_milestones: 5
  save_at_milestone_n : 2

  do_evaluate: true
  run_benchmarks: true
  resume_from_checkpoint: null

# ########################################################
# Dataset Configuration
# ########################################################

# configuration when data_builder is not enabled and use single dataset (usually for cpt)
dataset: 
  tokenize: false  
  use_sft: false    
  sample_size: null  
  text_field: "text"  
  name: "OpenLLM-Ro/fineweb2-ro-llm"
  split: "train"
  add_bos_eos: true  
  num_proc: 4

data_builder:
  enabled: false # default is cpt
  total_sample_size: null
  proportions: null  # Optional list override e.g. [0.8, 0.2] — overrides per-dataset proportion fields

  datasets:
    - name: "OpenLLM-Ro/fineweb2-ro-llm"
      split: "train"
      proportion: 0.9
      sample_size: null  # Use all 9,999 examples (~4.8M tokens)

    - name: "danp27/fineweb-edu-500k-sample"
      split: "train"
      proportion: 0.1
      sample_size: null  # Use all 15,011 examples (~4.4M tokens)

    # - name: "danp27/norobots_sft"
