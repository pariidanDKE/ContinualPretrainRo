seed: 23
model:
  builder:
    model_name: unsloth/Llama-3.2-1B
    load_in_4bit: true
    bnb_4bit_compute_dtype: bfloat16
    device_map: auto
    gradient_checkpointing: true
    use_cache: false
    prepare_kbit_training: true
    require_grads: true
    max_seq_length: 4096
    use_unsloth: true
    seed: 42
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.0
    bias: none
    task_type: CAUSAL_LM
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - embed_tokens
    - lm_head
training_args:
  output_dir: ./outputs/train_llama
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 4
  max_length: 4096
  logging_steps: 1
  learning_rate: 0.0001
  packing: true
  embedding_learning_rate: 2.0e-05
  num_train_epochs: 1
  save_steps: 100
  save_total_limit: 1
  report_to: wandb
  bf16: true
  fp16: false
  optim: paged_adamw_8bit
  lr_scheduler_type: cosine
  warmup_ratio: 0.06
  gradient_checkpointing: true
  max_grad_norm: 1
  per_device_eval_batch_size: 4
  dataset_text_field: text
  dataloader_drop_last: true
  eval_on_start: true
validation_cfg:
  return_validation: true
  validation_split: 0.1
milestone:
  tokens_per_milestone: 1000000
  num_milestones: 5
  save_at_milestone_n: 2
  do_evaluate: true
  run_benchmarks: true
  resume_from_checkpoint: null
dataset:
  tokenize: false
  use_sft: false
  sample_size: null
  text_field: text
  name: OpenLLM-Ro/fineweb2-ro-llm
  split: train
  add_bos_eos: true
  num_proc: 4
data_builder:
  enabled: false
  total_sample_size: null
  datasets:
  - name: danp27/norobots_sft
    split: train
    proportion: 0.024
    sample_size: null
  - name: ./data/formatted_data/dolly
    split: train
    proportion: 0.022
    sample_size: null
  - name: ./data/formatted_data/oasst
    split: train
    proportion: 0.024
    sample_size: null
  - name: ./data/formatted_data/camel
    split: train
    proportion: 0.465
    sample_size: 110000
  - name: ./data/formatted_data/orca
    split: train
    proportion: 0.5
    sample_size: 110000
  - name: ./data/formatted_data/maggie
    split: train
    proportion: 0.5
    sample_size: 110000
benchmark_evaluation_cfg:
  verbosity: INFO
  use_sft: false
  apply_chat_template: true
  eval_batch_size: 8
  num_fewshot: 5
  device: auto
  tasks_to_run:
  - _ro_mmlu
  - _ro_winogrande
  - _ro_belebele
  - _ro_arc_challenge
  - arc_challenge
  - winogrande
  - ro_wiki
  - wikitext
  perplexity_tasks:
  - ro_wiki
  - wikitext
  output_dir: eval_results
  max_length: 2048
  eval_max_length: 8192
  evaluation_tasks:
  - name: ro_wiki
    fewshot: 0
    task_batch_size: 8
    limit: 1000
  - name: _ro_mmlu
    fewshot: 5
    task_batch_size: 4
    limit: 1000
  - name: _ro_winogrande
    fewshot: 5
    task_batch_size: 8
    limit: 1000
  - name: _ro_belebele
    fewshot: 5
    task_batch_size: 4
    limit: 1000
  - name: _ro_arc_challenge
    fewshot: 5
    task_batch_size: 8
    limit: 1000
  - name: arc_challenge
    fewshot: 5
    task_batch_size: 8
    limit: 1000
  - name: winogrande
    fewshot: 5
    task_batch_size: 8
    limit: 1000
  - name: wikitext
    fewshot: 0
    task_batch_size: 8
    limit: 1000
wandb:
  enabled: true
  project: RoLLM
  run_name: null
  group: Default
  custom_run_name: TestContinuousLoop
